[project]
site_name = "Flowcean"
site_url = "https://flowcean.me/"
repo_url = "https://github.com/flowcean/flowcean"
repo_name = "flowcean/flowcean"
site_dir = "site"
extra_css = ["stylesheets/extra.css", "stylesheets/home.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "javascripts/home.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]
watch = ["src"]
nav = [
  { "Home" = "index.md" },
  { "Research Project" = [
    "agenc/index.md",
    { "Use Cases" = "agenc/use_cases.md" },
    { "Project partners" = [
      { "CML" = "agenc/cml.md" },
      { "KALP" = "agenc/kalp.md" },
      { "OFFIS" = "agenc/offis.md" },
      { "TUHH" = "agenc/tuhh.md" },
      { "VIVAVIS" = "agenc/vivavis.md" },
    ] },
  ] },
  { "Getting Started" = [
    { "Why Flowcean?" = "getting_started/why_flowcean.md" },
    { "Prerequisites" = "getting_started/prerequisites.md" },
    { "Installation" = "getting_started/installation.md" },
    { "New Project" = "getting_started/new_project.md" },
    { "Documentation" = "getting_started/documentation.md" },
    { "DVC" = "getting_started/dvc.md" },
  ] },
  { "User Guide" = [
    { "Overview" = "user_guide/overview.md" },
    { "Framework concepts" = [
      { "Modules" = "user_guide/modules.md" },
      { "Environment" = "user_guide/environment.md" },
      { "Transform" = "user_guide/transform.md" },
      { "Hybrid Systems" = "user_guide/hybrid_systems.md" },
      { "Model" = "user_guide/model.md" },
    ] },
    { "Learning and evaluation" = [
      { "Learning Strategies" = "user_guide/learning_strategies.md" },
      { "Evaluation" = "user_guide/evaluation.md" },
      { "Experiment" = "user_guide/experiment.md" },
    ] },
    { "Tools and reference" = [
      { "Tools" = "user_guide/tools.md" },
      { "Adapter" = "user_guide/adapter.md" },
      { "Glossary" = "user_guide/glossary.md" },
    ] },
  ] },
  { "Examples" = [
    { "Hybrid systems" = [
      { "Minimal Hybrid System" = "examples/hs_simple.md" },
      { "Hybrid Systems Gallery" = "examples/hybrid_systems.md" },
      { "Simulated Hybrid System Identification" = "examples/simulated_hybrid_system.md" },
    ] },
    { "Learning and testing" = [
      { "One Tank Offline" = "examples/one_tank.md" },
      { "One Tank Incremental" = "examples/one_tank_incremental.md" },
      { "Trace Prediction" = "examples/trace_prediction.md" },
      { "Coffee Machine" = "examples/coffee_machine.md" },
      { "XOR Function" = "examples/xor.md" },
      { "DDTIG" = "examples/ddtig.md" },
    ] },
    { "Applications" = [
      { "Automatic Lashing Platform" = "examples/automatic_lashing_platform.md" },
      { "Robot Localization Failure" = "examples/robot_localization_failure.md" },
      { "Jupyter Notebook Turtlesim" = "examples/jupyter_notebook_turtlesim.md" },
      { "Energy System" = "examples/energy_system.md" },
    ] },
  ] },
  { "API Reference" = [
    "reference/index.md",
    { "Foundations" = [
      { "Core" = "reference/core.md" },
      { "Hybrid Systems" = "reference/hybrid.md" },
      { "Polars" = "reference/polars.md" },
    ] },
    { "Learners and models" = [
      { "scikit-learn" = "reference/sklearn.md" },
      { "River" = "reference/river.md" },
      { "PyTorch" = "reference/torch.md" },
      { "PySR" = "reference/pysr.md" },
      { "XGBoost" = "reference/xgboost.md" },
      { "PalaestrAI" = "reference/palaestrai.md" },
      { "AALpy" = "reference/aalpy.md" },
      { "Ensemble" = "reference/ensemble.md" },
    ] },
    { "Integrations and tools" = [
      { "Adapters" = "reference/adapters.md" },
      { "ROS" = "reference/ros.md" },
      { "Mosaik" = "reference/mosaik.md" },
      { "Testing" = "reference/testing.md" },
      { "Utilities" = "reference/utilities.md" },
    ] },
  ] },
]

[project.theme]
custom_dir = "overrides"
variant = "modern"
language = "en"
logo = "assets/logo_blue.svg"
favicon = "assets/favicon.png"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
]
icon.repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/monitor-cog"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.caret = {}
pymdownx.critic = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tilde = {}

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
options.allow_inspection = false
options.docstring_style = "google"
options.docstring_section_style = "table"
options.filters = ["!^_"]
options.heading_level = 2
options.members_order = "source"
options.merge_init_into_class = true
options.show_category_heading = true
options.show_if_no_docstring = true
options.show_root_heading = true
options.show_root_full_path = false
options.show_source = false
options.show_submodules = false
options.show_signature_annotations = true
options.show_symbol_type_heading = true
options.show_symbol_type_toc = true
options.separate_signature = true
options.signature_crossrefs = true
