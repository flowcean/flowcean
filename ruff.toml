line-length = 79
extend-exclude = ["*/_generated/*_pb2*", "*.ipynb"]
target-version = "py312"

[format]
preview = false
docstring-code-format = true
docstring-code-line-length = 80

[lint]
preview = false
select = [
  # Fundamental Python mistakes; formatting is handled separately.
  "E4", "E7", "E9", "F",
  # Import ordering and modern Python syntax.
  "I", "UP",
  # Common bugs and useful simplifications.
  "B", "SIM", "C4", "PIE", "RUF",
  # Pylint errors and warnings, not refactoring prescriptions.
  "PLE", "PLW",
  # Datetimes and logging.
  "DTZ", "LOG", "G",
  # Security-sensitive constructs and accidental console/debug output.
  "S", "T10", "T20",
  # Scientific Python.
  "NPY",
  # Tests, annotations, stubs, and suppression hygiene.
  "PT", "ANN", "PYI", "PGH",
  # Consistency of existing docstrings.
  "D",
]
ignore = [
  "ANN401",  # Any is legitimate at dynamic integration boundaries.
  "D10",     # Don't require boilerplate docstrings everywhere.
  "D206",    # Formatter owns docstring indentation.
  "D300",    # Formatter owns docstring quoting.
  "PLW0603", # Deliberate module-level state isn't inherently wrong.
  "S311",    # Scientific randomness isn't cryptographic randomness.
]

[lint.per-file-ignores]
"**/tests/**/*" = ["ANN", "S101", "T20"]
"**/examples/**/*" = ["ANN", "S101", "T20"]
"**/scripts/**/*" = ["ANN", "T20"]
# Model persistence intentionally uses pickle; loading requires trusted input.
"src/flowcean/core/model.py" = ["S301"]
# These components explicitly report predictions or progress to the console.
"src/flowcean/polars/environments/datasetprediction.py" = ["T201"]
"src/flowcean/hybrid/hydra/callbacks.py" = ["T201"]

[lint.isort]
known-first-party = ["flowcean"]

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[lint.pydocstyle]
convention = "google"
