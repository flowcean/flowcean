<svg xmlns="http://www.w3.org/2000/svg" width="740" height="296" viewBox="0 0 740 296" role="img" aria-labelledby="title description">
  <title id="title">Bouncing ball: one flight mode</title>
  <desc id="description">The system starts in its only location, flight. Gravity changes velocity, and velocity changes height. A ground impact takes a self-loop: velocity reverses and is reduced in magnitude. The ball remains in the flight location; there is no separate resting location.</desc>
  <style>
    :root { --background: #f8fbfc; --foreground: #18323d; --line: #164b65; }
    @media (prefers-color-scheme: dark) {
      :root { --background: #102832; --foreground: #edf7fa; --line: #a9e1f2; }
    }
    svg { background: var(--background); fill: var(--foreground); }
    text { font-family: Arial, Helvetica, sans-serif; font-size: 16px; }
    .heading { font-size: 23px; font-weight: 700; }
    .subtitle, .note { font-size: 15px; }
    .mode { fill: #4763c7; fill-opacity: .1; stroke: #4763c7; stroke-width: 2; }
    .mode-name { font-size: 21px; font-weight: 700; }
    .event { font-weight: 700; }
    .arrow { fill: none; stroke: var(--line); stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--line)"/>
    </marker>
  </defs>
  <rect width="740" height="296" fill="var(--background)"/>
  <text class="heading" x="28" y="36">Bouncing ball</text>
  <text class="subtitle" x="28" y="61">One flight mode; impacts reset velocity, not the mode.</text>
  <path class="arrow" d="M 32 181 H 94"/>
  <text class="note" x="32" y="166">Start</text>
  <rect class="mode" x="94" y="124" width="256" height="112" rx="12"/>
  <text class="mode-name" x="222" y="161" text-anchor="middle">Flight</text>
  <text x="222" y="189" text-anchor="middle">Gravity changes velocity</text>
  <text x="222" y="213" text-anchor="middle">Velocity changes height</text>
  <path class="arrow" d="M 350 150 H 644 Q 656 150 656 162 V 216 Q 656 228 644 228 H 350"/>
  <text class="event" x="503" y="133" text-anchor="middle">Ground impact</text>
  <text x="503" y="182" text-anchor="middle">Reverse velocity and</text>
  <text x="503" y="205" text-anchor="middle">reduce its magnitude</text>
  <text class="note" x="370" y="273" text-anchor="middle">After every impact, motion continues in the same flight mode.</text>
</svg>
