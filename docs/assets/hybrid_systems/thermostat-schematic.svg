<svg xmlns="http://www.w3.org/2000/svg" class="hybrid-schematic" width="760" height="285" viewBox="0 0 760 285" role="img" aria-labelledby="thermostat-title" aria-describedby="thermostat-description">
  <title id="thermostat-title">Thermostat hybrid automaton</title>
  <desc id="thermostat-description">Two elliptical locations contain their differential equations. Heating follows dT/dt = 5 - 0.3(T - 20); cooling follows dT/dt = -0.3(T - 20). The transition to cooling is labeled T greater than or equal to 23; the return to heating is labeled T less than or equal to 21. These boundaries are reached on rising and falling crossings, respectively. The incoming arrow marks heating as the initial location.</desc>
  <!-- Equations match thermostat() defaults with a constant target of 22.
       Include inline so labels and shapes inherit the site's active palette. -->
  <defs>
    <marker id="thermostat-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path class="marker" d="M 0 0 L 10 4 L 0 8 Z"/>
    </marker>
    <style>
      .hybrid-schematic { display: block; box-sizing: border-box; width: 100%; height: auto; max-height: 24rem; padding: 0.7rem; color: inherit; font-family: inherit; }
      .hybrid-schematic .outline { fill: var(--md-default-bg-color--light, transparent); stroke: var(--md-primary-fg-color, currentColor); stroke-width: 1.7; }
      .hybrid-schematic .transition { fill: none; stroke: var(--md-primary-fg-color, currentColor); stroke-width: 1.7; marker-end: url(#thermostat-arrow); }
      .hybrid-schematic .marker { fill: var(--md-primary-fg-color, currentColor); }
      .hybrid-schematic text { fill: currentColor; text-anchor: middle; }
      .hybrid-schematic .name { font-size: 23px; font-weight: 500; }
      .hybrid-schematic .math { font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif; font-size: 24px; }
      .hybrid-schematic .variable { font-style: italic; }
      .hybrid-schematic .guard { fill: var(--md-default-fg-color--light, currentColor); }
    </style>
  </defs>

  <ellipse class="outline" cx="196" cy="148" rx="155" ry="58"/>
  <ellipse class="outline" cx="568" cy="148" rx="155" ry="58"/>

  <circle class="marker" cx="8" cy="148" r="2.5"/>
  <path class="transition" d="M 11 148 H 40"/>
  <path class="transition" d="M 261 95.35 C 337 39, 427 39, 503 95.35"/>
  <path class="transition" d="M 503 200.65 C 427 257, 337 257, 261 200.65"/>

  <text class="name" x="196" y="135">Heating</text>
  <text class="math" x="196" y="168"><tspan class="variable">Ṫ</tspan> = 5 − 0.3(<tspan class="variable">T</tspan> − 20)</text>
  <text class="name" x="568" y="135">Cooling</text>
  <text class="math" x="568" y="168"><tspan class="variable">Ṫ</tspan> = −0.3(<tspan class="variable">T</tspan> − 20)</text>

  <text class="math guard" x="382" y="35"><tspan class="variable">T</tspan> ≥ 23</text>
  <text class="math guard" x="382" y="272"><tspan class="variable">T</tspan> ≤ 21</text>
</svg>
