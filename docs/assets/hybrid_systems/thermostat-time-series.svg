    .hybrid-time-series .tick { fill: var(--md-default-fg-color--light, currentColor); font-size: 16px; }
    .hybrid-time-series .grid { fill: none; stroke: var(--md-typeset-table-color, currentColor); stroke-width: 1; }
    .hybrid-time-series .axis { fill: none; stroke: var(--md-default-fg-color--lighter, currentColor); stroke-width: 1.2; }
    .hybrid-time-series .curve { fill: none; stroke: var(--md-primary-fg-color, currentColor); stroke-width: 2; stroke-linejoin: round; }
  </style>
