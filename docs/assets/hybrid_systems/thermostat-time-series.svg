  <title id="thermostat-series-title">Room temperature over time</title>
  <desc id="thermostat-series-description">Temperature starts at 20 degrees Celsius, rises to 23, then repeatedly cools to 21 and warms to 23 during the ten-minute recording.</desc>
  <!-- Data: the construction example in docs/user_guide/hybrid_systems.md,
       evaluated every 0.02 time units and at its event times.
       Plot coordinates: x = 76 + 65.6 * t; y = 226 - 60 * (T - 20). -->
