name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Run checks
        run: just check

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Run tests
        run: just test

  package:
    name: Package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Build package distributions
        run: just package

      - name: Smoke-test installed wheel
        shell: bash
        run: |
          smoke_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/flowcean-wheel.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          uv venv --python 3.14 "$smoke_dir"
          uv pip install --python "$smoke_dir/bin/python" dist/*.whl
          "$smoke_dir/bin/python" -I - <<'PY'
          import importlib
          import sys
          from pathlib import Path

          for name in ("core", "polars", "sklearn", "grpc"):
              module = importlib.import_module(f"flowcean.{name}")
              path = Path(module.__file__).resolve()
              assert path.is_relative_to(Path(sys.prefix).resolve()), path
              print(f"Imported {module.__name__} from {path}")
          PY

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Build docs
        run: just docs

  examples:
    name: Examples
    strategy:
      matrix:
        example: ["boiler", "linear_data", "one_tank", "xor", "trace_prediction", "hs-simple", "hybrid_systems", "simulated_hybrid_system", "system_behavior_learning"]
    runs-on: ubuntu-24.04
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Resolve Julia executable
        if: ${{ matrix.example == 'simulated_hybrid_system' }}
        shell: bash
        run: |
          # Remove once JuliaCall includes the fix for:
          # https://github.com/JuliaPy/PythonCall.jl/issues/816
          if julia_exe="$(command -v julia)"; then
            julia_exe="$(readlink -f "$julia_exe")"
            dirname "$julia_exe" >> "$GITHUB_PATH"
          fi

      - name: Run Example [${{ matrix.example }}]
        run: |
          just examples-${{ matrix.example }}
